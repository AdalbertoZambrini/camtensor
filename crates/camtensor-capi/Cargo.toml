[package]
name = "camtensor-capi"
description = "C ABI for camtensor"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "camtensor_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["cuda", "ffmpeg", "jpeg"]
cuda = ["camtensor/cuda"]
ffmpeg = ["camtensor/ffmpeg"]
jpeg = ["camtensor/jpeg"]

[dependencies]
camtensor.workspace = true
serde_json.workspace = true

[lints]
workspace = true
