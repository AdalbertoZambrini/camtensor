[package]
name = "camtensor-decode"
description = "Video decoders for camtensor: NVDEC and CPU (libavcodec, zune-jpeg)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["nvdec", "ffmpeg", "jpeg"]
## NVIDIA hardware decoding through the dynamically loaded nvcuvid library.
nvdec = ["dep:camtensor-cuda"]
## CPU decoding through a dynamically loaded libavcodec (H.264, H.265, MJPEG).
ffmpeg = ["dep:libloading"]
## Pure-Rust MJPEG decoding (no external library needed).
jpeg = ["dep:zune-jpeg", "dep:zune-core"]

[dependencies]
camtensor-core.workspace = true
camtensor-cuda = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
zune-jpeg = { version = "0.5.15", optional = true }
zune-core = { version = "0.5", optional = true }
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true

[lints]
workspace = true
