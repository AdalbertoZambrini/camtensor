[package]
name = "camtensor-preprocess"
description = "Fused colour conversion, resize, normalisation and affine crops (CPU and CUDA)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["rayon"]
# Row-parallel processing of large outputs with rayon (`Parallelism::Rayon`).
rayon = ["dep:rayon"]

[dependencies]
camtensor-core.workspace = true
half = { workspace = true, features = ["std"] }
rayon = { workspace = true, optional = true }

[lints]
workspace = true
