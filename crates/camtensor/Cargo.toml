[package]
name = "camtensor"
description = "Camera streams to inference-ready tensors: RTSP ingest, GPU decode and fused preprocessing"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["cuda", "ffmpeg", "jpeg"]
## NVIDIA GPU support (NVDEC decoding + CUDA preprocessing), loaded at runtime.
cuda = ["dep:camtensor-cuda", "camtensor-decode/nvdec"]
## CPU decoding of H.264/H.265/MJPEG through a runtime-loaded libavcodec.
ffmpeg = ["camtensor-decode/ffmpeg"]
## Pure-Rust MJPEG decoder.
jpeg = ["camtensor-decode/jpeg"]

[dependencies]
camtensor-core.workspace = true
camtensor-bitstream.workspace = true
camtensor-ingest.workspace = true
camtensor-decode.workspace = true
camtensor-preprocess.workspace = true
camtensor-cuda = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[lints]
workspace = true
