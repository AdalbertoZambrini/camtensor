[workspace]
resolver = "3"
members = [
    "crates/camtensor-core",
    "crates/camtensor-bitstream",
    "crates/camtensor-ingest",
    "crates/camtensor-cuda",
    "crates/camtensor-decode",
    "crates/camtensor-preprocess",
    "crates/camtensor",
    "crates/camtensor-service",
    "crates/camtensor-client",
    "crates/camtensor-capi",
    "crates/camtensor-py",
    "crates/camtensor-cli",
    "xtask",
]
default-members = [
    "crates/camtensor-core",
    "crates/camtensor-bitstream",
    "crates/camtensor-ingest",
    "crates/camtensor-cuda",
    "crates/camtensor-decode",
    "crates/camtensor-preprocess",
    "crates/camtensor",
    "crates/camtensor-service",
    "crates/camtensor-client",
    "crates/camtensor-capi",
    "crates/camtensor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/AdalbertoZambrini/camtensor"
authors = ["Adalberto Zambrini"]
keywords = ["rtsp", "video", "cuda", "inference", "computer-vision"]
categories = ["multimedia::video", "computer-vision"]

[workspace.dependencies]
camtensor-core = { path = "crates/camtensor-core", version = "0.1.0" }
camtensor-bitstream = { path = "crates/camtensor-bitstream", version = "0.1.0" }
camtensor-ingest = { path = "crates/camtensor-ingest", version = "0.1.0" }
camtensor-cuda = { path = "crates/camtensor-cuda", version = "0.1.0" }
camtensor-decode = { path = "crates/camtensor-decode", version = "0.1.0" }
camtensor-preprocess = { path = "crates/camtensor-preprocess", version = "0.1.0" }
camtensor = { path = "crates/camtensor", version = "0.1.0" }
camtensor-service = { path = "crates/camtensor-service", version = "0.1.0" }
camtensor-client = { path = "crates/camtensor-client", version = "0.1.0" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
half = "2"
libloading = "0.9"
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
