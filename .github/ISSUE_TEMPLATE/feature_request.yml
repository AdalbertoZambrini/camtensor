name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working (API, configuration, behaviour).
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Scale (number of cameras, resolution), hardware, constraints.
